# (5.547, 10.318, 7.5): two 90^3 substrate cubes (Si eps 11.9 | SiO2 eps 3.9) sharing the
# buried junction x = 5.547, with a 90x90x9 host slab (eps 10) on top spanning z in [3,12]
# (contains the z=7.5 orbital plane). Junction under the lattice centre -> ~half the lattice
# over each substrate. Box order [Si cube, SiO2 cube, slab]; all orbitals (z=7.5) lie in the
# slab, so they screen by eps 10 (box-based multi-region screening).
boxes = [
  [-39.453, 10.318, -42.0, 90.0, 90.0, 90.0, 11.9],
  [50.547, 10.318, -42.0, 90.0, 90.0, 90.0, 3.9],
  [5.547, 10.318, 7.5, 90.0, 90.0, 9.0, 10.0],
]

[solve]
n_quad = 6
edge_refine_level = 2
rhs_tol = 1e-3
lhs_tol = 1e-5
gmres_rtol = 1e-5
support_rtol = 1e-4
volume_tol = 1e-5
max_order = 8
max_depth = 128

[batching]
n_centers_per_batch = 1

[eval]
far_pad_steps = 2.0
